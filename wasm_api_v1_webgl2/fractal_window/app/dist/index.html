<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title></title>
        <base href="/">
        <style type="text/css">
            :focus {
                outline: none;
            }

            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            .root {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .main-canvas {
                display: block;
            }
        </style>

        <script>
            const ZNAME = "fractal_window"; // ZNAME definition 2 of 2
            document.title = ZNAME;
            document.write(`
                <link rel="modulepreload" href="/wasm/${ZNAME}.js" crossorigin="anonymous">
                <link rel="preload" href="/wasm/${ZNAME}_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm">
            `);
        </script>
    </head>

    <body>
        <script src="js/BodyParams.js"></script>
        <script src="zone-params.js"></script>
        <script src="js/ZoneParams.js"></script>
        <script src="js/xr-loop.js"></script>
        
        <script type="module">
            const wasmModule = await import(`/wasm/${ZNAME}.js`);
            const init = wasmModule.default;
            const bindings = wasmModule;

            const wasm = await init({ module_or_path: `/wasm/${ZNAME}_bg.wasm` });
            window.wasmBindings = bindings;
            dispatchEvent(new CustomEvent("ZTApplicationStarted", {detail: {wasm}}));
        </script> <!-- TODO add data integrity back in -->

        <div class="root">
            <canvas class="main-canvas" id="xr_canvas"></canvas>
        </div>
    </body>
</html>
